<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tripie-travel company</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz@9..40&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page">
    <div class="container">
      <header class="header">
        <div class="header__logo">
          <img
            src="./images/Logo symbol.png"
            class="header__logo-img"
            alt="Tripie Logo"
          />
          <a href="#" class="header__logo-link">Tripie</a>
        </div>
        <nav class="nav">
          <ul class="nav__list">
            <li class="nav__item"><a href="#" class="nav__link">Tours</a></li>
            <li class="nav__item">
              <a href="#" class="nav__link">Destination</a>
            </li>
            <li class="nav__item">
              <a href="#" class="nav__link">Virtual tour</a>
            </li>
            <li class="nav__item"><a href="#" class="nav__link">Blog</a></li>
            <li class="nav__item"><a href="#" class="nav__link">About</a></li>
            <li class="nav__item"><a href="#" class="nav__link">Contact</a></li>
            <li class="nav__item nav__item--language">
              <button class="language-selector">
                <img
                  src="./images/Line.png"
                  alt=""
                  class="language-selector__flag"
                  aria-hidden="true"
                />
                <span class="language-selector__text">English</span>
              </button>
            </li>
          </ul>
        </nav>
        <div class="header__actions">
          <a href="#" class="header__action-link header__action-link--text"
            >Login</a
          >
          <a href="#" class="header__action-link header__action-link--button"
            >Sign up</a
          >
        </div>
      </header>
    </div>
    <main class="main">
      <section class="hero">
        <div class="container">
          <div class="hero__content">
            <h1 class="hero__title">Discover the most engaging places</h1>
            <p class="hero__subtitle">
              Less planning 45,000 trips are ready for you
            </p>
            <button class="hero__button">Start now</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
